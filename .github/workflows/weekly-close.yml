name: Weekly Analysis

on:
  schedule:
    # Friday 20:00 Asia/Shanghai = Friday 12:00 UTC.
    - cron: '0 12 * * 5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run the weekly report immediately for manual testing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-close-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt
          python -m pip show akshare baostock longbridge
      - name: Fetch, analyze and email weekly close
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          REPORT_FREQUENCY: weekly
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_SECURITY: ${{ secrets.EMAIL_SMTP_SECURITY }}
          DATA_REQUEST_TIMEOUT: ${{ secrets.DATA_REQUEST_TIMEOUT }}
          DATA_RETRY_ATTEMPTS: ${{ secrets.DATA_RETRY_ATTEMPTS }}
          PRICE_RANGE_DAYS: ${{ secrets.PRICE_RANGE_DAYS }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_TOKEN_CACHE_B64: ${{ secrets.LONGBRIDGE_OAUTH_TOKEN_CACHE_B64 }}
          LONGBRIDGE_CONNECTION_COOLDOWN_SECONDS: ${{ secrets.LONGBRIDGE_CONNECTION_COOLDOWN_SECONDS }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            args+=(--scheduled)
          fi
          if [ "$FORCE_RUN" = "true" ]; then
            python -m stock_report "${args[@]}" --force-run
          else
            python -m stock_report "${args[@]}"
          fi
