name: Daily closing report

on:
  # 定时触发：周一至周五，北京时间 18:00（UTC 10:00）。
  schedule:
    - cron: '0 10 * * 1-5'  # 周一至周五，UTC 10:00 = 北京时间 18:00

  # 手动触发：Actions → Daily closing report → Run workflow。
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制运行测试（跳过周末及18点前检查；报告标记为手动测试）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-close-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch, analyze and email daily close
        env:
          PYTHONUNBUFFERED: '1'
          TZ: Asia/Shanghai
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run }}
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_SECURITY: ${{ secrets.EMAIL_SMTP_SECURITY }}
          DATA_REQUEST_TIMEOUT: ${{ secrets.DATA_REQUEST_TIMEOUT }}
          DATA_RETRY_ATTEMPTS: ${{ secrets.DATA_RETRY_ATTEMPTS }}
          HISTORY_DAYS: ${{ secrets.HISTORY_DAYS }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_TOKEN_CACHE_B64: ${{ secrets.LONGBRIDGE_OAUTH_TOKEN_CACHE_B64 }}
          LONGBRIDGE_REGION: ${{ secrets.LONGBRIDGE_REGION }}
          LONGBRIDGE_HTTP_URL: ${{ secrets.LONGBRIDGE_HTTP_URL }}
          LONGBRIDGE_QUOTE_WS_URL: ${{ secrets.LONGBRIDGE_QUOTE_WS_URL }}
          LONGBRIDGE_TRADE_WS_URL: ${{ secrets.LONGBRIDGE_TRADE_WS_URL }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            python -m stock_report --force-run
          else
            python -m stock_report
          fi
