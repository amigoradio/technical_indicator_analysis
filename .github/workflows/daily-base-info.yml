name: Daily Base Info

on:
  schedule:
    - cron: '0 9 * * 1-5' # 北京时间 17:00
  workflow_dispatch:
  workflow_call:
    inputs:
      module:
        type: string
        required: true
      csv_path:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: csv-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CSV_MODULE: ${{ inputs.module }}
      CSV_PATH: ${{ inputs.csv_path }}
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Shanghai
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Update CSV
        id: update
        shell: bash
        run: |
          modules=(stock_report.erp stock_report.margin stock_report.charge stock_report.pepb)
          if [[ -n "$CSV_MODULE" ]]; then
            modules=("$CSV_MODULE")
          fi
          args=(update)
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            args+=(--scheduled)
          fi
          failed=0
          for module in "${modules[@]}"; do
            if ! python -m "$module" "${args[@]}"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Commit and push CSV
        if: ${{ !cancelled() && (steps.update.outcome == 'success' || steps.update.outcome == 'failure') }}
        shell: bash
        run: |
          paths=(csv_data/margin.csv csv_data/erp.csv csv_data/charge.csv csv_data/pepb.csv)
          if [[ -n "$CSV_PATH" ]]; then
            paths=("$CSV_PATH")
          fi
          files=()
          for path in "${paths[@]}"; do
            if [[ -f "$path" ]]; then
              files+=("$path")
            fi
          done
          if [[ "${#files[@]}" == 0 ]]; then
            exit 0
          fi
          git add -- "${files[@]}"
          if git diff --cached --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update base info CSV" --only -- "${files[@]}"
          git fetch origin "$GITHUB_REF"
          git rebase FETCH_HEAD
          git push origin "HEAD:$GITHUB_REF"
